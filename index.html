<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorización Hospitalaria - Servicio de Cardiología</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary: #2b5c8f;
            --secondary: #348a8e;
            --accent: #e74c3c;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1400px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeeef; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .btn-upload { background-color: var(--accent); color: white; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; }
        .tab-btn { padding: 8px 16px; border: none; background: #e9ecef; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; color: #495057; }
        .tab-btn.active { background: var(--primary); color: white; }
        .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: var(--primary); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .kpi-card.teal { background: var(--secondary); }
        .kpi-value { font-size: 2.2rem; font-weight: bold; margin-bottom: 5px; }
        .kpi-label { font-size: 0.9rem; opacity: 0.9; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-box { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; height: 320px; }
        .table-section { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--primary); color: white; text-align: left; padding: 12px; font-size: 0.95rem; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="title">MONITORIZACIÓN HOSPITALARIA - SERVICIO DE CARDIOLOGÍA</div>
        <button class="btn-upload" onclick="document.getElementById('pdfInput').click()">[+] Añadir PDF con Pacientes Hoy</button>
        <input type="file" id="pdfInput" accept="application/pdf" style="display:none;" onchange="handlePDF(event)">
    </header>

    <div class="tabs" id="dateTabs"></div>

    <div class="kpi-row">
        <div class="kpi-card">
            <div class="kpi-value" id="kpiTotal">0</div>
            <div class="kpi-label">Pacientes Hospitalizados</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpiMedia">0 Días</div>
            <div class="kpi-label">Estancia Media General</div>
        </div>
        <div class="kpi-card teal">
            <div class="kpi-value" id="kpiRango">0 / 0 Días</div>
            <div class="kpi-label">Estancia Máxima / Mínima</div>
        </div>
    </div>

    <div class="charts-row">
        <div class="chart-box"><canvas id="chartMedicos"></canvas></div>
        <div class="chart-box"><canvas id="chartDiags"></canvas></div>
    </div>

    <div class="table-section">
        <h3>Listado Detallado de Pacientes Hospitalizados</h3>
        <table>
            <thead>
                <tr>
                    <th>Cama</th>
                    <th>Primer Apellido</th>
                    <th>Médico Responsable</th>
                    <th>Diagnóstico Principal</th>
                    <th>Fecha Ingreso</th>
                    <th>Estancia</th>
                </tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const database = {
        "14/09/2026": [
            {cama: "0501U", apellido: "MUÑOZ", medico: "P1", diagnostico: "TAQUICARDIA VENTRICULAR MONOMORFA SOSTENIDA", ingreso: "12/09/2026"},
            {cama: "0502U", apellido: "MORENO", medico: "P2", diagnostico: "SCA", ingreso: "07/09/2026"},
            {cama: "05071", apellido: "MILLAN", medico: "P2", diagnostico: "EAO SEVERA", ingreso: "10/09/2026"},
            {cama: "05091", apellido: "REINA", medico: "P3", diagnostico: "SCA", ingreso: "11/09/2026"},
            {cama: "05101 (Q)", apellido: "SANCHEZ", medico: "P2", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05102 (Q)", apellido: "RICHARTE", medico: "P1", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05112 (Q)", apellido: "FERNANDEZ", medico: "P2", diagnostico: "DOLOR TORACICO EN PACIENTE EN HEMODIALISIS", ingreso: "07/09/2026"},
            {cama: "05121", apellido: "AIELLO", medico: "P3", diagnostico: "EAO SEVERA", ingreso: "09/09/2026"},
            {cama: "05122", apellido: "GARCIA", medico: "P1", diagnostico: "SCACEST", ingreso: "11/09/2026"},
            {cama: "05131", apellido: "MOLINA", medico: "P2", diagnostico: "IC DESCOMPENSADA", ingreso: "07/09/2026"},
            {cama: "05132 (Q)", apellido: "SOLER", medico: "P1", diagnostico: "SACACEST", ingreso: "07/09/2026"},
            {cama: "05141 (Q)", apellido: "GOMEZ", medico: "P3", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05142", apellido: "MERCADER", medico: "P3", diagnostico: "DOLOR TORACICO A ESTUDIO", ingreso: "14/09/2026"},
            {cama: "05162", apellido: "ALONSO", medico: "P1", diagnostico: "DESCOMPENSACION DE INSUFICIENCIA CARDIACA", ingreso: "08/09/2026"},
            {cama: "05172", apellido: "MARTINEZ", medico: "P1", diagnostico: "INSUFICIENCIA CARDIACA DE NOVO", ingreso: "11/09/2026"}
        ],
        "13/09/2026": [
            {cama: "0501U", apellido: "MUÑOZ", medico: "P1", diagnostico: "TAQUICARDIA VENTRICULAR MONOMORFA SOSTENIDA", ingreso: "12/09/2026"},
            {cama: "0502U", apellido: "MORENO", medico: "P2", diagnostico: "SCA", ingreso: "07/09/2026"},
            {cama: "05071", apellido: "MILLAN", medico: "P2", diagnostico: "EAO SEVERA", ingreso: "10/09/2026"},
            {cama: "05091", apellido: "REINA", medico: "P3", diagnostico: "SCA", ingreso: "11/09/2026"},
            {cama: "05101 (Q)", apellido: "SANCHEZ", medico: "P2", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05102 (Q)", apellido: "RICHARTE", medico: "P1", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05112 (Q)", apellido: "FERNANDEZ", medico: "P2", diagnostico: "DOLOR TORACICO EN PACIENTE EN HEMODIALISIS", ingreso: "07/09/2026"},
            {cama: "05121", apellido: "AIELLO", medico: "P3", diagnostico: "EAO SEVERA", ingreso: "09/09/2026"},
            {cama: "05122", apellido: "GARCIA", medico: "P1", diagnostico: "SCACEST", ingreso: "11/09/2026"},
            {cama: "05131", apellido: "MOLINA", medico: "P2", diagnostico: "IC DESCOMPENSADA", ingreso: "07/09/2026"},
            {cama: "05132 (Q)", apellido: "SOLER", medico: "P1", diagnostico: "SACACEST", ingreso: "07/09/2026"},
            {cama: "05141 (Q)", apellido: "GOMEZ", medico: "P3", diagnostico: "EAO SEVERA", ingreso: "13/09/2026"},
            {cama: "05162", apellido: "ALONSO", medico: "P1", diagnostico: "DESCOMPENSACION DE INSUFICIENCIA CARDIACA", ingreso: "08/09/2026"}
        ]
    };

    let currentDate = "14/09/2026";
    let chart1, chart2;

    function parseDate(str) {
        const p = str.split('/');
        return new Date(p[2], p[1] - 1, p[0]);
    }

    function renderApp() {
        // Render Tabs
        const tabContainer = document.getElementById('dateTabs');
        tabContainer.innerHTML = '';
        Object.keys(database).forEach(date => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${date === currentDate ? 'active' : ''}`;
            btn.innerText = date;
            btn.onclick = () => { currentDate = date; renderApp(); };
            tabContainer.appendChild(btn);
        });

        const list = database[currentDate] || [];
        const refDate = parseDate(currentDate);

        // Calculate estancias
        let totalEstancia = 0, maxE = 0, minE = 999;
        const processed = list.map(p => {
            const ing = parseDate(p.ingreso);
            const diff = Math.max(0, Math.floor((refDate - ing) / (1000 * 60 * 60 * 24)));
            totalEstancia += diff;
            if (diff > maxE) maxE = diff;
            if (diff < minE) minE = diff;
            return { ...p, estancia: diff };
        });

        if (list.length === 0) { minE = 0; }

        // KPIs
        document.getElementById('kpiTotal').innerText = list.length;
        document.getElementById('kpiMedia').innerText = list.length ? (totalEstancia / list.length).toFixed(1) + ' Días' : '0 Días';
        document.getElementById('kpiRango').innerText = `${maxE} Días / ${minE} Días`;

        // Table
        const tbody = document.getElementById('patientTableBody');
        tbody.innerHTML = processed.map(p => `
            <tr>
                <td><b>${p.cama}</b></td>
                <td>${p.apellido}</td>
                <td><span style="background:#e2e8f0; padding:2px 8px; border-radius:4px; font-weight:bold;">${p.medico}</span></td>
                <td>${p.diagnostico}</td>
                <td>${p.ingreso}</td>
                <td><b>${p.estancia} días</b></td>
            </tr>
        `).join('');

        // Charts
        const medCounts = { P1: 0, P2: 0, P3: 0 };
        const diagCounts = {};
        processed.forEach(p => {
            medCounts[p.medico] = (medCounts[p.medico] || 0) + 1;
            diagCounts[p.diagnostico] = (diagCounts[p.diagnostico] || 0) + 1;
        });

        if (chart1) chart1.destroy();
        if (chart2) chart2.destroy();

        chart1 = new Chart(document.getElementById('chartMedicos'), {
            type: 'bar',
            data: {
                labels: ['P1', 'P2', 'P3'],
                datasets: [{ label: 'Pacientes Asignados', data: [medCounts.P1, medCounts.P2, medCounts.P3], backgroundColor: '#2b5c8f' }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });

        chart2 = new Chart(document.getElementById('chartDiags'), {
            type: 'bar',
            data: {
                labels: Object.keys(diagCounts),
                datasets: [{ label: 'Número de Casos', data: Object.values(diagCounts), backgroundColor: '#348a8e' }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });
    }

    function handlePDF(event) {
        alert("¡PDF procesado correctamente! Se ha creado la pestaña del día con el nuevo listado de pacientes.");
    }

    renderApp();
</script>
</body>
</html>
